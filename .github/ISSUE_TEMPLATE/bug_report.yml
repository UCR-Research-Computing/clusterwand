name: Bug report
description: Something did not work, or a diagnosis was wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: ClusterWand version
      description: Output of `clusterwand version`
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How you ran it
      options: [CLI, MCP stdio, Other]
    validations:
      required: true
  - type: input
    id: slurm
    attributes:
      label: Slurm version and site (if relevant)
      description: Output of `sinfo --version`; the cluster or site profile, if you can share it
      placeholder: slurm 23.11.4, a university cluster
  - type: input
    id: client
    attributes:
      label: MCP client (if any)
      placeholder: Claude Code, GitHub Copilot, Gemini CLI, Hermes, Codex, OpenCode, script...
  - type: textarea
    id: what
    attributes:
      label: What you did and what happened
      description: The command or tool call, and the output (`--json` helps). Remove usernames and anything private.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
